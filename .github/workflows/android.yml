
name: HQQUIZ Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o HQQUIZ_Native_Android_Project.zip -d extracted

      - 

      - name: Fix JVM targets
        run: |
          find extracted -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 | while IFS= read -r -d '' file; do
            sed -i \
              -e 's/VERSION_1_8/VERSION_17/g' \
              -e 's/jvmTarget = "1.8"/jvmTarget = "17"/g' \
              -e "s/jvmTarget = '1.8'/jvmTarget = '17'/g" \
              -e 's/JVM_1_8/JVM_17/g' \
              "$file"
          done
          echo "Gradle files after correction:"
          grep -RnE 'VERSION_1_8|jvmTarget.*1\.8|JVM_1_8' extracted || true

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HQQUIZ-APK
          path: extracted/**/build/outputs/apk/debug/*.apk

